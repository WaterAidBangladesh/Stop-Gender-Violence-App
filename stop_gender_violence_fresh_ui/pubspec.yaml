name: stop_gender_violence_ui

description: Stop Gender Violence - UI (v2 ready).

publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=2.18.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # Firebase core + services
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1
  provider: ^6.0.5

  # Other packages
  url_launcher: ^6.3.0
  youtube_player_iframe: ^4.0.4
  flutter_pdfview: ^1.3.2
  intl_phone_field: ^3.2.0
  file_picker: ^8.0.0
  change_app_package_name: ^1.5.0
  http: ^1.6.0
  flutter_markdown: ^0.7.7+1


dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  shared_preferences: ^2.1.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.jpg"


flutter:
  uses-material-design: true
  assets:
    # Bharosha's safety rules and referral text, generated from the Python
    # source by bharosha_service/tools/export_shared.py. Bundled so emergency
    # detection and the referral numbers work offline, with no server call.
